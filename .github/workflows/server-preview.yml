name: Docker branch checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/TcpLatencyMonitor.Core/**'
      - 'src/IpQualityMonitor.*/**'
      - 'tests/IpQualityMonitor.Server.Tests/**'
      - 'tests/server/**'
      - 'tools/mtr/**'
      - 'tools/NextTraceGeoHelper/**'
      - 'docs/NEXTTRACE-DOCKER.md'
      - 'deploy/**'
      - 'README.md'
      - 'docs/DOCKER-BRIDGE-PREVIEW.md'
      - 'verification/server-preview/**'
      - '.github/workflows/server-preview.yml'
  push:
    branches: [docker, 'docker/**', 'feature/docker-*']
    paths:
      - 'src/TcpLatencyMonitor.Core/**'
      - 'src/IpQualityMonitor.*/**'
      - 'tests/IpQualityMonitor.Server.Tests/**'
      - 'tests/server/**'
      - 'tools/mtr/**'
      - 'tools/NextTraceGeoHelper/**'
      - 'docs/NEXTTRACE-DOCKER.md'
      - 'deploy/**'
      - 'README.md'
      - 'docs/DOCKER-BRIDGE-PREVIEW.md'
      - 'verification/server-preview/**'
      - '.github/workflows/server-preview.yml'
permissions:
  contents: read
concurrency:
  group: server-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-preview:
    name: Linux amd64 build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Static contracts
        run: |
          python3 -m unittest discover -s tests/server -p 'test_*.py' -v
          node --check src/IpQualityMonitor.Web/wwwroot/app.js
      - name: Compose initialization and configuration
        run: |
          sudo sh deploy/init.sh
          sudo sh deploy/init.sh
          sudo docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
          sudo docker compose --env-file deploy/.env -f deploy/compose.yaml -f deploy/compose.ipv6.yaml config --quiet
      - name: Core and adapter checks
        run: docker build --target tests -f deploy/Dockerfile .
      - name: Build runtime image
        run: docker build -t ipqualitymonitor:server-preview -f deploy/Dockerfile .
      - name: Install browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/iqm-browser" --no-save --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/iqm-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Bridge, HTTP and browser regression tests
        run: |
          export NODE_PATH="$RUNNER_TEMP/iqm-browser/node_modules"
          IQM_BROWSER_SMOKE=1 bash tests/server/smoke-container.sh
# Build/test only: no credentials, registry publication, or deployment.

