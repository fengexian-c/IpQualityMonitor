name: Server preview checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/TcpLatencyMonitor.Core/**'
      - 'src/IpQualityMonitor.*/**'
      - 'tests/IpQualityMonitor.Server.Tests/**'
      - 'tests/server/**'
      - 'tools/mtr/**'
      - 'deploy/**'
      - '.github/workflows/server-preview.yml'
  push:
    branches: [main, 'feature/docker-*']
    paths:
      - 'src/TcpLatencyMonitor.Core/**'
      - 'src/IpQualityMonitor.*/**'
      - 'tests/IpQualityMonitor.Server.Tests/**'
      - 'tests/server/**'
      - 'tools/mtr/**'
      - 'deploy/**'
      - '.github/workflows/server-preview.yml'
permissions:
  contents: read
concurrency:
  group: server-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Static contracts
        run: |
          python3 -m unittest discover -s tests/server -p 'test_*.py' -v
          node --check src/IpQualityMonitor.Web/wwwroot/app.js
      - name: Core and adapter checks
        run: docker build --target tests -f deploy/Dockerfile .
      - name: Build runtime image
        run: docker build -t ipqualitymonitor:server-preview -f deploy/Dockerfile .
      - name: Bridge and HTTP smoke test
        run: bash tests/server/smoke-container.sh
# Deliberately no push to GHCR and no release publication in this first preview.
